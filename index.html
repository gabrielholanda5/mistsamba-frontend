<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>MistSamba</title>
</head>
<body class="bg-[#090C15]">
    <header class="sticky top-0 z-30">
        <div class="flex justify-between items-center px-6 py-4 bg-[#0F131E] border border-b-[#1F293D]">
            <div class="flex gap-2">
               <div class="flex items-center">
                    <box-icon type='logo' name='deezer' class="h-10 w-10" color="#ffffff"></box-icon>
                </div>
                <div class="flex items-center md:flex-col md:items-start">
                    <h1 class="font-bold text-lg opacity-100">MistSamba</h1>
                    <p class="hidden md:flex font-medium text-sm text-[#94A3B8]">Agenda de Compromissos</p>
                </div> 
            </div>
            <div>
                <button class="bg-blue-500 hover:bg-blue-600 rounded-xl py-2 px-4 cursor-pointer shadow-lg">+ Novo Evento</button>
            </div>
        </div>
    </header>
    <main>
        <div class="flex gap-2 mt-6 px-6">
            <box-icon name='calendar-alt' color="blue" ></box-icon>
            <h2 class="text-[#94A3B8]">COMPROMISSOS AGENDADOS</h2>
        </div>
        <div class="flex flex-col mt-6 px-6 gap-4">
            <div class="flex justify-between items-center py-4 px-4 bg-[#121723] border border-[#1F293D] hover:border-[#334155] rounded-xl">
                <div class="flex gap-4">
                    <div class="flex flex-col justify-center items-center py-2 px-6 rounded-lg bg-[#1E293B] ">
                        <p class="text-[10px] text-[#94A3B8]">NOV</p>
                        <p class="text-[25px]">20</p>
                        <p class="text-[10px] text-[#94A3B8]">SEX</p>
                    </div>
                    <div class="flex flex-col justify-between gap-2 ">
                        <div>
                            <p>Giz</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-[#94A3B8]">Arena Beira-Mar (Fortaleza - CE)</p>
                        </div>
                        <div class="flex gap-2">
                            <p class="text-[10px] bg-[#1E293B] px-2 py-0.5 rounded-md">Inicio: </p>
                            <p class="text-[10px] bg-[#1E293B] px-2 py-0.5 rounded-md">Fim:</p>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col gap-4 md:flex-row">
                    <button class="cursor-pointer"><box-icon type='solid' name='edit' color="#ffffff"></box-icon></button>
                    <button class="cursor-pointer"><box-icon name='trash' color="#ffffff" ></box-icon></button>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-center">
            <div class="flex flex-col bg-[#121723] border border-[#1F293D] rounded-2xl mx-6 my-4 px-6 py-4">
                <div class="flex justify-between w-full border-b border-[#1F293D] pb-4">
                    <h3>Novo Evento</h3>
                    <box-icon name='x' color="#ffffff" class="cursor-pointer"></box-icon>
                </div>
                <form action="" class="mt-2 flex flex-col gap-2">
                    <div>
                        <label for="" class="text-[10px] text-[#94A3B8]">Nome do Evento *</label>
                        <input type="text" class="w-full px-2 bg-[#090C15] border border-[#1F293D] rounded-md">
                    </div>
                    <div>
                        <label for="" class="text-[10px] text-[#94A3B8]">Local</label>
                        <input type="text" class="w-full px-2 bg-[#090C15] border border-[#1F293D] rounded-md">
                    </div>
                    <div>
                        <label for="" class="text-[10px] text-[#94A3B8]">Data *</label>
                        <input type="date" class="w-full px-2 bg-[#090C15] border border-[#1F293D] rounded-md">
                    </div>
                    <div class="flex justify-between gap-4 border-b border-[#1F293D] pb-4">
                        <div class="w-1/2">
                            <label for="" class="text-[10px] text-[#94A3B8]">Horário de Início *</label>
                            <input type="time" class="w-full px-2 bg-[#090C15] border border-[#1F293D] rounded-md"> 
                        </div>
                        <div class="w-1/2">
                            <label for="" class="text-[10px] text-[#94A3B8]">Horário do Fim *</label>
                            <input type="time" class="w-full px-2 bg-[#090C15] border border-[#1F293D] rounded-md">
                        </div>
                    </div>
                    <div class="flex justify-end mt-2">
                        <button class="bg-blue-500 rounded-xl hover:bg-blue-600 py-2 px-4 cursor-pointer">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
        
    </main>

     <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

</body>
</html>
